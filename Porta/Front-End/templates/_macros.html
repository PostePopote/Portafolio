{% macro campo(f) %}
    {% if f.type == "BooleanField" %}
        <div class="campo-check">{{ f }} {{ f.label }}</div>
    {% else %}
        <div>
            {{ f.label }}
            {{ f }}
            {% for e in f.errors %}<small class="error-campo">{{ e }}</small>{% endfor %}
        </div>
    {% endif %}
{% endmacro %}
