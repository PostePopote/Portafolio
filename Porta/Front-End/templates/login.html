{% extends "base.html" %}

{% block titulo %}Ingresar{% endblock %}

{% block contenido %}
<form method="POST" class="formulario formulario-centrado">
    <h2>Ingresar</h2>

    <!-- hidden_tag agrega el token CSRF, sin esto el formulario falla -->
    {{ form.hidden_tag() }}

    <div>
        {{ form.username.label }}
        {{ form.username }}
    </div>

    <div>
        {{ form.password.label }}
        {{ form.password }}
    </div>

    {{ form.enviar(class="boton") }}
</form>
{% endblock %}
